name: CI/CD

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

env:
  RENDER_SERVICE_ID: srv-dbas0krbc2fs73cinen0
  API_URL: https://acme-salary-api-vys1.onrender.com
  UI_URL: https://acme-salary-ui.vercel.app

# One production release at a time, never cancelled halfway.
concurrency:
  group: ${{ github.ref == 'refs/heads/production' && 'production-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: salary
          POSTGRES_PASSWORD: salary
          POSTGRES_DB: salary
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://salary:salary@localhost:5432/salary
      TEST_DATABASE_URL: postgresql+psycopg://salary:salary@localhost:5432/salary
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-api:
    needs: [backend, backend-postgres, frontend]
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy this commit to Render and wait until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth="Authorization: Bearer $RENDER_API_KEY"
          id=$(curl -fsS -X POST "$api" -H "$auth" -H "Content-Type: application/json"             -d "{\"commitId\": \"$GITHUB_SHA\"}" | jq -r .id)
          echo "Render deploy $id"
          for attempt in $(seq 1 60); do
            status=$(curl -fsS "$api/$id" -H "$auth" | jq -r .status)
            echo "$status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Render" && exit 1

  deploy-ui:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@64.5.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  smoke-test:
    needs: deploy-ui
    runs-on: ubuntu-latest
    steps:
      - name: Live API and site respond
        run: |
          curl -fsS --retry 5 --retry-delay 10 "$API_URL/health"
          curl -fsS "$API_URL/api/insights/summary"
          curl -fsS -o /dev/null "$UI_URL"
