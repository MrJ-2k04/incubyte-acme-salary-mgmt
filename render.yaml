services:
  - type: web
    name: acme-salary-api
    runtime: python
    plan: free
    region: singapore
    branch: production
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
